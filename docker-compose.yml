name: treino-ci

services:
  postgres:
    image: postgres:16
    container_name: treino-ci-postgres
    environment:
      # Credenciais só da sua máquina. O CI usa outras (veja o workflow).
      POSTGRES_USER: usuario_local
      POSTGRES_PASSWORD: senha_local
      POSTGRES_DB: banco_alunos
    ports:
      # 5434 nesta máquina. 5432 e 5433 já têm outros Postgres.
      # Dentro do container a porta continua 5432.
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usuario_local -d banco_alunos"]
      interval: 5s
      timeout: 5s
      retries: 10
